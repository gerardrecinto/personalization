# Lab layout: Redis and the Pub/Sub emulator stand in for Memorystore and Pub/Sub.
apiVersion: apps/v1
kind: Deployment
metadata: {name: redis, labels: {app: redis}}
spec:
  replicas: 1
  selector: {matchLabels: {app: redis}}
  template:
    metadata: {labels: {app: redis}}
    spec:
      containers:
        - name: redis
          image: redis:7-alpine
          ports: [{containerPort: 6379}]
          readinessProbe: {exec: {command: [redis-cli, ping]}, periodSeconds: 3}
          resources: {requests: {cpu: 50m, memory: 64Mi}, limits: {memory: 256Mi}}
---
apiVersion: v1
kind: Service
metadata: {name: redis}
spec: {selector: {app: redis}, ports: [{port: 6379}]}
---
apiVersion: apps/v1
kind: Deployment
metadata: {name: pubsub, labels: {app: pubsub}}
spec:
  replicas: 1
  selector: {matchLabels: {app: pubsub}}
  template:
    metadata: {labels: {app: pubsub}}
    spec:
      containers:
        - name: emulator
          image: gcr.io/google.com/cloudsdktool/google-cloud-cli:emulators
          command: [gcloud, beta, emulators, pubsub, start, "--host-port=0.0.0.0:8085", "--project=lab-project"]
          ports: [{containerPort: 8085}]
          readinessProbe: {tcpSocket: {port: 8085}, periodSeconds: 3, failureThreshold: 40}
          resources: {requests: {cpu: 100m, memory: 256Mi}, limits: {memory: 768Mi}}
---
apiVersion: v1
kind: Service
metadata: {name: pubsub}
spec: {selector: {app: pubsub}, ports: [{port: 8085}]}
---
apiVersion: v1
kind: ConfigMap
metadata: {name: app-env}
data:
  REDIS_URL: redis://redis:6379/0
  PUBSUB_EMULATOR_HOST: pubsub:8085
  GCP_PROJECT: lab-project
---
apiVersion: v1
kind: Secret
metadata: {name: app-secret}
stringData: {USER_HASH_SECRET: lab-only-secret}
---
apiVersion: apps/v1
kind: Deployment
metadata: {name: api, labels: {app: api}}
spec:
  replicas: 2
  strategy: {rollingUpdate: {maxUnavailable: 0, maxSurge: 1}}
  progressDeadlineSeconds: 120
  selector: {matchLabels: {app: api}}
  template:
    metadata: {labels: {app: api}}
    spec:
      securityContext: {runAsNonRoot: true, runAsUser: 10001}
      containers:
        - name: api
          image: personalization-lab:ci
          imagePullPolicy: IfNotPresent
          envFrom: [{configMapRef: {name: app-env}}, {secretRef: {name: app-secret}}]
          ports: [{containerPort: 8000}]
          readinessProbe: {httpGet: {path: /readyz, port: 8000}, periodSeconds: 3, failureThreshold: 40}
          livenessProbe: {httpGet: {path: /healthz, port: 8000}, periodSeconds: 10}
          securityContext: {allowPrivilegeEscalation: false, readOnlyRootFilesystem: true, capabilities: {drop: [ALL]}}
          resources: {requests: {cpu: 100m, memory: 128Mi}, limits: {memory: 256Mi}}
---
apiVersion: v1
kind: Service
metadata: {name: api}
spec: {selector: {app: api}, ports: [{port: 80, targetPort: 8000}]}
---
apiVersion: apps/v1
kind: Deployment
metadata: {name: worker, labels: {app: worker}}
spec:
  replicas: 1
  selector: {matchLabels: {app: worker}}
  template:
    metadata: {labels: {app: worker}}
    spec:
      securityContext: {runAsNonRoot: true, runAsUser: 10001}
      containers:
        - name: worker
          image: personalization-lab:ci
          imagePullPolicy: IfNotPresent
          command: [python, -m, personalization.worker]
          envFrom: [{configMapRef: {name: app-env}}, {secretRef: {name: app-secret}}]
          securityContext: {allowPrivilegeEscalation: false, readOnlyRootFilesystem: true, capabilities: {drop: [ALL]}}
          resources: {requests: {cpu: 100m, memory: 128Mi}, limits: {memory: 256Mi}}
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata: {name: api}
spec: {minAvailable: 1, selector: {matchLabels: {app: api}}}
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata: {name: api}
spec:
  scaleTargetRef: {apiVersion: apps/v1, kind: Deployment, name: api}
  minReplicas: 2
  maxReplicas: 6
  metrics:
    - type: Resource
      resource: {name: cpu, target: {type: Utilization, averageUtilization: 70}}
