# Same unit tests and image build as CI. Not run on CircleCI.
version: 2.1
jobs:
  test:
    docker: [{image: cimg/python:3.12}]
    steps:
      - checkout
      - run: pip install -r requirements-dev.txt && pytest tests/test_unit.py
  image:
    machine: {image: ubuntu-2404:current}
    steps:
      - checkout
      - run: docker build -t personalization-lab:ci .
workflows:
  main:
    jobs: [test, image]
